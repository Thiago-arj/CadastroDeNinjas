<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Ninja</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #101114;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .ninja {
            width: 500px;
            margin: 0 auto;
            padding: 30px;
            background: #1a1c20;
            border-radius: 12px;
        }

        .ninja img {
            display: block;
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin: 0 auto 25px;
        }

        .ninja p {
            padding: 12px 0;
            margin: 0;
            border-top: 1px solid #30333a;
        }

        .ninja strong {
            color: #b8bdc7;
        }

        .ninja a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            background: #30343b;
            color: white;
            font-size: 14px;
        }

        .ninja a:hover {
            background: #454a53;
        }
    </style>
</head>

<body>

<h1>Detalhes do Ninja</h1>

<div class="ninja">

    <img th:src="${ninja.img_url}" alt="Imagem do Ninja">

    <p><strong>ID:</strong> <span th:text="${ninja.id}"></span></p>

    <p><strong>Nome:</strong> <span th:text="${ninja.nome}"></span></p>

    <p><strong>Idade:</strong> <span th:text="${ninja.idade}"></span></p>

    <p><strong>Email:</strong> <span th:text="${ninja.email}"></span></p>

    <p><strong>Rank:</strong> <span th:text="${ninja.rank}"></span></p>

    <p>
        <strong>Missão:</strong>

        <span th:if="${ninja.missoes}">
            <span th:text="${ninja.missoes.nome}"></span>
            - Dificuldade:
            <span th:text="${ninja.missoes.dificuldade}"></span>
        </span>

        <span th:if="${ninja.missoes == null}">
            Sem missão cadastrada
        </span>
    </p>

    <a th:href="@{/ninjas/ui/listar}">Voltar</a>

</div>

</body>
</html>
